# ================= AI 智能客服配置 =================
# 是否启用大模型。false 时使用纯规则引擎+商品库检索兜底，项目照样完整可跑。
app.ai.enabled=false
# OpenAI 兼容接口地址（DeepSeek/Kimi/智谱/通义 等均可）：
#   DeepSeek: https://api.deepseek.com/v1            模型 deepseek-chat
#   Kimi:     https://api.moonshot.cn/v1             模型 moonshot-v1-8k
#   智谱:     https://open.bigmodel.cn/api/paas/v4   模型 glm-4-flash（免费）
app.ai.base-url=https://open.bigmodel.cn/api/paas/v4
app.ai.api-key=
app.ai.model=glm-4-flash

# 商品图上传保存的目录（相对 webapp 根；也可改为绝对路径）
upload.dir=upload
# 单张图片最大 5MB
upload.max-size=5242880
